# Render Blueprint — deploys the FastAPI backend with no manual form filling.
#
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Everything below is applied automatically; SECRET_KEY is generated by Render, so
# the only thing left to set by hand is ALLOWED_ORIGINS once the frontend has a URL.
#
# NOTE: the free plan has an ephemeral filesystem, so the SQLite file is recreated
# on every deploy or wake-from-idle. Startup seeding is what keeps the demo looking
# populated. For durable storage, move to a paid plan and attach a disk mounted at
# /data, then set DATABASE_URL=sqlite:////data/route53.db (four slashes).
services:
  - type: web
    name: route53-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      # Cross-site cookies need SameSite=None; Secure once the frontend is on
      # a different domain than the API.
      - key: ENVIRONMENT
        value: production
      # Replace with the Vercel URL after the frontend is deployed. Exact match,
      # comma-separated for more than one origin.
      - key: ALLOWED_ORIGINS
        sync: false
